<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music-hub — Your Sound, Your Space</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">M</span><span>Music-hub</span></div><div class="nav-group"><p class="eyebrow">Discover</p><button class="nav active" data-view="home">⌂ Home</button><button class="nav" data-view="explore">✦ Explore</button><button class="nav" data-view="charts">↗ Charts</button></div><div class="nav-group"><p class="eyebrow">Library</p><button class="nav" data-view="liked">♥ Liked songs</button><button class="nav" data-view="recent">◷ Recently played</button><button class="nav" data-view="downloads">↓ Downloads</button></div><div class="playlist-block"><div class="eyebrow-row"><p class="eyebrow">Your playlists</p><button id="newPlaylist">＋</button></div><div id="playlistList"></div></div><div class="sidebar-bottom"><button class="nav">⚙ Settings</button><div class="mini-note">Built for late-night listening.<br><strong>Music-hub</strong> · v1</div></div></aside><main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><div class="search-wrap">⌕<input id="search" placeholder="Search songs, artists, albums..."></div><div class="top-actions"><button class="icon-btn" id="themeBtn">◐</button><button class="avatar">MG</button></div></header><div class="content" id="content"></div></main><aside class="queue-panel"><div class="queue-head"><div><p class="eyebrow">Up next</p><h3>Your queue</h3></div><button class="text-btn" id="clearQueue">Clear</button></div><div id="queue"></di
